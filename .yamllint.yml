extends: default
rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: false
  document-end:
    present: false
  indentation:
    spaces: 2
    indent-sequences: consistent
  trailing-spaces:
    level: error
  empty-lines:
    max: 1
    max-end: 1
    max-start: 1
  braces:
    max-spaces-inside: 1
    min-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
    min-spaces-inside: 1
  colons:
    max-spaces-after: 1
    max-spaces-before: 0
  comments:
    level: warning
    require-starting-space: true
