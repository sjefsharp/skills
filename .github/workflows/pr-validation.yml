---
name: PR Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: Validate Skills (Hermes HARDLINE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q pytest pyyaml

      - name: Run skill validation (Hermes HARDLINE)
        run: |
          .venv/bin/python scripts/validate-skills.py --all

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q pytest pyyaml

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -q

  commitlint:
    name: Commit Message Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install commitlint
        run: |
          npm ci 2>/dev/null || npm install @commitlint/cli @commitlint/config-conventional @gitmoji/parser-opts @gitmoji/commit-types commitlint-plugin-gitmoji

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" > /tmp/pr-title.txt
          npx commitlint --edit /tmp/pr-title.txt

      - name: Validate new commit messages only
        run: |
          # Get list of new commits in this PR (excluding merge commits)
          commits=$(git log --oneline --no-merges origin/main..HEAD --format="%H" | tac)
          if [ -z "$commits" ]; then
            echo "No new commits to validate"
            exit 0
          fi
          # Write commit messages to a temp file for commitlint
          for commit in $commits; do
            git log -1 --format="%B" "$commit" >> /tmp/commit-messages.txt
            echo "" >> /tmp/commit-messages.txt
          done
          npx commitlint --edit /tmp/commit-messages.txt

  branch-name:
    name: Branch Name Validation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Validate branch name follows Conventional Branch format
        run: |
          branch="$HEAD_REF"
          # Allow trunk branches
          if echo "$branch" | grep -qE '^(master|main|develop)$'; then
            exit 0
          fi
          # Feature branches must follow Conventional Branch format
          # Types: feat, feature, fix, bugfix, hotfix, release, chore, docs, refactor, perf, test, build, ci, a11y, security, ai, claude, codex, copilot, cursor
          # Allow nested paths like feat/software-development/skill-lint
          pattern='^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|build|ci|a11y|security|ai|claude|codex|copilot|cursor)(\/[a-z0-9-]+)+$'
          if ! echo "$branch" | grep -qE "$pattern"; then
            echo "ERROR: Branch name '$branch' does not follow Conventional Branch format"
            echo "Expected: <type>/<category>/<short-description> (or master/main/develop for trunk)"
            echo "Types: feat, feature, fix, bugfix, hotfix, release, chore, docs, refactor, perf, test, build, ci, a11y, security, ai, claude, codex, copilot, cursor"
            exit 1
          fi

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for MIT license headers
        run: |
          # Verify new/modified files have license headers where applicable
          find skills -name "SKILL.md" -exec grep -l "license: MIT" {} \; | wc -l

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install markdownlint
        run: npm ci 2>/dev/null || npm install markdownlint-cli2

      - name: Run markdownlint on changed files only
        run: |
          # Get list of changed markdown files in this PR
          changed_files=$(git diff --name-only origin/main..HEAD -- '*.md' | tr '\n' ' ')
          if [ -z "$changed_files" ]; then
            echo "No markdown files changed"
            exit 0
          fi
          npx markdownlint-cli2 "$changed_files" --config .markdownlint.json

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run yamllint
        run: |
          pip install yamllint -q
          yamllint -c .yamllint.yml .

  validate-workflow:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow files
        uses: docker://docker.io/rhysd/actionlint:1.7.4
        with:
          args: -color

  check-summary:
    name: Check Summary
    runs-on: ubuntu-latest
    needs:
      - validate-skills
      - test
      - commitlint
      - branch-name
      - security
      - markdown-lint
      - yaml-lint
      - validate-workflow
    if: always()
    timeout-minutes: 2
    steps:
      - name: Check all jobs passed
        run: |
          # Skip jobs that were skipped (e.g., branch-name on push events)
          for job in validate-skills test commitlint branch-name security markdown-lint yaml-lint validate-workflow; do
            result="${{ needs.$job.result }}"
            if [[ "$result" == "skipped" ]]; then
              echo "Job $job was skipped, ignoring"
              continue
            fi
            if [[ "$result" != "success" ]]; then
              echo "Job $job failed with result: $result"
              exit 1
            fi
          done
          echo "All checks passed"
